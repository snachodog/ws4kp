---
services:
  ws4kp:
    image: ghcr.io/snachodog/ws4kp-server:latest
    container_name: ws4kp
    restart: unless-stopped
    environment:
      # Any permalink query-string parameter can be set as a default here by
      # prefixing it with WSQS_ (camelCase params keep their name; hyphenated
      # params use underscores, e.g. current-weather -> WSQS_current_weather).
      # With these set, visiting the site with no query string auto-loads this
      # configuration instead of prompting for it in the browser - and since
      # each of these is a WSQS_-forced value, its control is also removed
      # from the page entirely (Settings panel and the "selected displays"
      # checkboxes both hide anything set here).
      - WSQS_latLonQuery=Orlando International Airport Orlando FL USA
      # selected displays - values below match the app's own defaults; flip
      # any of these to customize which panels are shown, in rotation order
      - WSQS_hazards=true
      - WSQS_current_weather=true
      - WSQS_latest_observations=true
      - WSQS_hourly=false
      - WSQS_hourly_graph=true
      - WSQS_travel=false
      - WSQS_regional_forecast=true
      - WSQS_local_forecast=true
      - WSQS_extended_forecast=true
      - WSQS_almanac=true
      - WSQS_spc_outlook=true
      - WSQS_radar=true
    ports:
      - "8082:8080"
